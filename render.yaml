databases:
  - name: exam-seating-db
    databaseName: exam_seating
    user: exam_user
    plan: free

services:
  # Unified Full-Stack Web Service (Frontend + Backend in one service)
  - type: web
    name: exam-seating-allotment
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exam-seating-db
          property: connectionString
