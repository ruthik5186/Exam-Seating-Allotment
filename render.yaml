services:
  # Backend API Web Service
  - type: web
    name: exam-seating-backend
    runtime: node
    plan: free
    rootDir: exam-seating-backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"

  # Frontend React Static Site
  - type: web
    name: exam-seating-frontend
    runtime: static
    plan: free
    rootDir: exam-seating-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
